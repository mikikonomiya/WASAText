openapi: 3.0.3
info:
  title: WASAText API specification
  description: API for the WASAText messaging web application
  version: "1"

tags:
  - name: login
    description: user authentication
  - name: user
    description: managing user profile
  - name: groups
    description: managing group chats
  - name: conversations
    description: |
      managing all conversations
      (group chats and one-to-one chats)
  - name: messages
    description: text or photo messages

paths:
  /session:
    post:
      tags: ["login"]
      summary: Logs in the user
      description: |-
        If the user does not exist, it will be created,
        and an identifier is returned.
        If the user exists, the user identifier is returned.
      operationId: doLogin
      requestBody:
        description: User details
        content:
          application/json:
            schema:
              description: User details (username)
              type: object
              properties:
                name:
                  description: unique username of user
                  type: string
                  example: 'Maria'
                  pattern: ^[a-zA-Z0-9._]+$
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        "201":
          description: User log-in action successful
          content:
            application/json:
              schema:
                description: unique identifier for the user
                type: object
                properties:
                  identifier:
                    description: the user ID
                    type: string
                    minLength: 8
                    maxLength: 32
                    pattern: '^[a-zA-Z0-9]+$'
                    example: "abcdef012345"
        "400":
          $ref: "#/components/responses/BadRequestError" 
  /users:
    get:
      tags: ["user"]
      summary: List all WASAText users or search by username
      description: |
        If the 'username' parameter is provided in the query,
        it searches for a WASAText user with that name.
        Otherwise, it returns a list of all existing users,
        sorted in alphabetical order.
      operationId: searchUsers
      parameters:
        - name: username
          in: query
          required: false
          schema:
            description: unique username of user
            type: string
            example: 'Maria'
            pattern: ^[a-zA-Z0-9._]+$
            minLength: 3
            maxLength: 16
          description: Search query to filter users by username.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of users retrieved successfully.
          content:
            application/json:
              schema:
                description: array of users
                type: array
                maxItems: 1000
                minItems: 0
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Username Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /user/name:
    put:
      tags: ["user"]
      summary: Change username
      description: |
        The authenticated user can update their username,
        if the new username is not already in use.
      operationId: setMyUserName
      security:
        - BearerAuth: []
      requestBody:
        description: New username
        required: true
        content:
          application/json:
            schema:
              description: New username
              type: object
              properties:
                name:
                  description: New username
                  type: string
                  example: 'Luca'
                  pattern: ^[a-zA-Z0-9._]+$
                  minLength: 3
                  maxLength: 16
      responses:
        "204":
          description: Username changed successfully.
        "400":
          $ref: "#/components/responses/BadRequestError" 
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          description: The new username is already in use.
  /user/photo:
    put:
      tags: ["user"]
      summary: Change profile picture
      description: |
        The authenticated user can update their profile picture
      operationId: setMyPhoto
      security:
        - BearerAuth: []
      requestBody:
        description: New profile picture
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: New profile picture
              properties:
                photo:
                  type: string
                  minLength: 1
                  maxLength: 5242880
                  pattern: '^.*$'
                  format: binary
                  description: |
                    The image file (e.g., JPEG or PNG) to upload as
                    profile picture
      responses:
        "204":
          description: Profile picture updated successfully (No Content).
        "400":
          $ref: "#/components/responses/BadRequestError" 
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /users/{username}:
    get:
      tags: ["user"]
      summary: Get user profile details
      description: Retrieves the profile (username, photo URL) for a specific WASAText user.
      operationId: getUserProfile
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          required: true
          description: The username of the WASAText user to retrieve.
          schema:
            description: The username of the WASAText user to retrieve.
            type: string
            example: 'Luca'
            pattern: ^[a-zA-Z0-9._]+$
            minLength: 3
            maxLength: 16
      responses:
        "200":
          description: User profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: User not found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /user/groups/{groupId}:
    parameters:
      - name: groupId
        in: path
        required: true
        description: this is the group Id
        schema:
          description: unique identifier for group
          type: string
          minLength: 8
          maxLength: 32
          pattern: '^[a-zA-Z0-9]+$'
          example: "abcdef012345"
    delete:
      tags: ["groups"]
      summary: Leave group
      description: |
        Allows the authenticated user to leave a group
        they are a member of.
      operationId: leaveGroup
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Successfully left the group (No content returned).
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Group not found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /conversations:
    get:
      tags: ["conversations"]
      summary: Retrieve the list of all user's conversations
      description: |
        Get a list al all one-on-one conversations and group chats,
        sorted in reversed chronological order.
      operationId: getMyConversations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Conversations retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                description: |
                  list of all chats sorted in reversed chronological order
                minItems: 0
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/conversation"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      tags: ["conversations"]
      summary: Start a new one-to-one conversation
      description: |
        Starts a new conversation with a specific user
        if one doesnt already exist.
        Otherwise, it returns the id of the existing conversation.
      operationId: startConversation
      security:
        - BearerAuth: []
      requestBody:
        description: Username of the target user.
        required: true
        content:
          application/json:
            schema:
              description: username of the target user.
              type: object
              properties:
                targetUsername:
                  type: string
                  pattern: ^[a-zA-Z0-9._]+$
                  minLength: 3
                  maxLength: 16
                  description: Username of the user to start the conversation with.
      responses:
        "200":
          description: Conversation already exists; returns the existing id.
          content:
            application/json:
              schema:
                description: id of the existing conversation
                type: object
                properties:
                  conversationId:
                    description: conversation id
                    type: string
                    example: "abcs56837"
                    minLength: 8
                    maxLength: 32
                    pattern: '^[a-zA-Z0-9]+$'
        "201":
          description: Conversation successfully created or retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/conversation"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Target User Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /conversations/{conversationId}:
    get:
      parameters:
        - name: conversationId
          in: path
          required: true
          description: this is the conversation id.
          schema:
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "absc55459"
            description: conversation id
      tags: ["conversations"]
      summary: Get the messages of a specific conversation.
      description: |
        Get all exchanged messages for the given conversation,
        in reversed chronological order.
      operationId: getConversation
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Messages retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                description: list of messages
                minItems: 0
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/message"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Conversation Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
    delete:
      tags: ["conversations"]
      summary: Delete a conversation history (for me)
      description: |
        Deletes the entire conversation history only for the authenticated user.
        If its a group, the member will still be a group member.
      operationId: deleteConversation
      security:
        - BearerAuth: []
      parameters:
        - name: conversationId
          in: path
          required: true
          description: The ID of the conversation.
          schema:
            description: id of the conversation
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "abcdef012345"
      responses:
        "204":
          description: Conversation history deleted successfully (No Content).
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Conversation Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /conversations/{conversationId}/messages:
    post:
      parameters:
        - name: conversationId
          in: path
          required: true
          description: this is the conversation id.
          schema:
            description: id of the conversation
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "abcdef012345"
      tags: ["messages", "conversations"]
      summary: Send a new text message.
      description: |
        Send a new text and return the identifier (messageId)
      operationId: sendMessage
      security:
        - BearerAuth: []
      requestBody:
        description: Message content (text)
        content:
          application/json:
            schema:
              description: message
              type: object
              properties:
                textContent:
                  type: string
                  description: The text content of the message.
                  minLength: 1
                  maxLength: 1000
                  pattern: '^\s*[\s\S]*$'
        required: true
      responses:
        "200":
          description: Message sent successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/message"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Conversation Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /conversations/{conversationId}/photos:
    post:
      parameters:
        - name: conversationId
          in: path
          required: true
          description: The id of the conversation.
          schema:
            description: conversation id
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "absbf5593"
      tags: ["messages", "conversations"]
      summary: Send a new photo message.
      description: Uploads and sends a new photo message to the conversation.
      operationId: sendPhotoMessage
      security:
        - BearerAuth: []
      requestBody:
        description: The image file to be uploaded.
        required: true
        content:
          multipart/form-data:
            schema:
              description: The image to be uploaded.
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  minLength: 1 
                  maxLength: 5242880 
                  pattern: '^.*$' 
                  description: The image file (e.g., JPEG or PNG) to upload.
      responses:
        "204":
          description: Photo message successfully sent.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Conversation Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
    get:
      parameters:
        - name: conversationId
          in: path
          required: true
          description: The unique identifier of the conversation.
          schema:
            description: conversation id
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            type: string
            example: "abcdef012345"
      tags: ["conversations"]
      summary: Get conversation photo gallery
      description: Retrieves a list of all photo messages (as a gallery) sent within a specific conversation.
      operationId: getConvPhotos
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Photo gallery URLs retrieved successfully.
          content:
            application/json:
              schema:
                description: list of URL of photos
                type: array
                minItems: 0
                maxItems: 100
                items:
                  type: string
                  format: url
                  example: "https://wasatext.app/storage/photos/abc.jpg"
                  minLength: 10
                  maxLength: 2048
                  pattern: '^https?://.+$'
                  description: URL of the photo message.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Conversation Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /conversations/{conversationId}/messages/starred:
    get:
      parameters:
        - name: conversationId
          in: path
          required: true
          description: The unique identifier of the conversation.
          schema:
            description: The unique identifier of the conversation.
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "abcdef012345"
      tags: ["messages", "conversations"]
      summary: Get all starred messages in a specific conversation.
      description: Retrieves a list of messages starred by the authenticated user within the given conversation.
      operationId: getConvStarredMessages
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Starred messages retrieved successfully.
          content:
            application/json:
              schema:
                description: array of starred messages
                type: array
                minItems: 0
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/message"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Conversation Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /messages:
    get:
      tags: ["messages"]
      summary: Search messages by content.
      description: |
        Search for text messages containing the query string
        (among all conversations of the authorized user).
      operationId: searchMessages
      security:
        - BearerAuth: []
      parameters:
        - name: textMessage
          in: query
          required: true
          schema:
            description: term to filter message content
            type: string
            minLength: 1
            maxLength: 1000
            pattern: '^.*\S.*$'
          description: Search term to filter message content.
      responses:
        "200":
          description: List of matching messages retrieved successfully.
          content:
            application/json:
              schema:
                description: array of matching messages
                type: array
                minItems: 0
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/message"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /messages/forwarded:
    post:
      tags: ["messages"]
      summary: Forward an existing message.
      description: |
        Forwards the content of an existing message to a
        destination chat.
      operationId: forwardMessage
      security:
        - BearerAuth: []
      requestBody:
        description: Source message id and destination conversation id.
        content:
          application/json:
            schema:
              description: IDs needed
              type: object
              properties:
                sourceMessageId:
                  type: string
                  minLength: 8
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9]+$'
                  description: id of the message to be forwarded.
                destinationConversationId:
                  type: string
                  minLength: 8
                  maxLength: 32
                  pattern: '^[a-zA-Z0-9]+$'
                  description: |
                    id of the conversation where the message has
                    to be forwarded
        required: true
      responses:
        "204":
          description: Message forwarded successfully.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: |
            Source message or destination conversation not found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /messages/starred:
    get:
      tags: ["messages"]
      summary: Get all starred messages.
      description: Retrieves a list of all messages starred by the authenticated user.
      operationId: getAllStarredMessages
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Starred messages retrieved successfully.
          content:
            application/json:
              schema:
                description: list of starred messages
                type: array
                minItems: 0
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/message"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /messages/{messageId}/star:
    put:
      tags: ["messages"]
      summary: Star a message
      description: Marks a specific message as starred for the authenticated user.
      operationId: starMessage
      security:
        - BearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          description: The id of the message to star.
          schema:
            description: The id of the message to star.
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "abcdef012345"
      responses:
        "204":
          description: Message successfully starred (No Content).
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Message Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
    delete:
      tags: ["messages"]
      summary: Unstar a message
      description: |
        Removes the star marking from a specific message for
        the authenticated user.
      operationId: unstarMessage
      security:
        - BearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          description: The unique identifier of the message to unstar.
          schema:
            description: The unique identifier of the message to unstar
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "abcdef012345"
      responses:
        "204":
          description: Star successfully removed (No Content).
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Message not found or Message wasn't starred.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /messages/{messageId}/reactions/me:
    parameters:
      - name: messageId
        in: path
        required: true
        description: this is the message Id
        schema:
          description: this is the message Id
          type: string
          minLength: 8
          maxLength: 32
          pattern: '^[a-zA-Z0-9]+$'
          example: "abcdef012345"
    put:
      tags: ["messages"]
      summary: Add or substitute a reaction to a message.
      description: |
        Send a reaction (emoticon) to an existing message.
        If the user has already posted a reaction, the new reaction
        will substitute the existiing reaction.
      operationId: commentMessage
      security:
      - BearerAuth: []
      requestBody:
        description: The emoticon used for the reaction.
        required: true
        content:
          application/json:
            schema:
              description: The emoticon used for the reaction.
              type: object
              properties:
                emoticon:
                  description: The emoticon used for the reaction.
                  type: string
                  minLength: 1
                  maxLength: 16
                  pattern: '^\P{L}\s*$'
      responses:
        "204":
          description: Reaction created successfully.
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Message Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
    delete:
      tags: ["messages"]
      summary: Delete the user's reaction to a message.
      description: |
        Delete the authenticated user's reaction to an existing message.
      operationId: uncommentMessage
      security:
      - BearerAuth: []
      responses:
        "204":
          description: |
            Reaction removed successfully (No Content Returned).
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: |
            Message not found or user's reaction not found.
            content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /messages/{messageId}:
    delete:
      tags: ["messages"]
      summary: Delete an existing message.
      description: |
        The sender of the message can eliminate a message either
        only for themselves or for all members of the conversation.
      operationId: deleteMessage
      security:
        - BearerAuth: []
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            description: The unique identifier of the message to delete.
        - name: scope
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 8
            enum:
            - me
            - everyone
            description: it is the scope of the deletion
      responses:
        "204":
          description: Message deleted successfully (No Content)
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: |
            Forbidden (Authenticated user is not the sender
            of the message, or the time imiti for 'everyone' has expired)
        "404":
          description: |
            Message not found or user's reaction not found.
            content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /groups:
    post:
      tags: ["groups"]
      summary: Create a new group chat
      description: Creates a new group by inserting a name and the list of members.
      operationId: createGroup
      security:
        - BearerAuth: []
      requestBody:
        description: Group details (name and members).
        required: true
        content:
          application/json:
            schema:
              description: Group details (name and members).
              type: object
              properties:
                groupName:
                  type: string
                  description: The desired name for the new group.
                  example: Study Group
                  pattern: ^.*$
                  minLength: 3
                  maxLength: 25
                memberUsernames:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: |
                    List of usernames to invite to the group
                    (excluding the creator).
                  items:
                    description: username of group member
                    type: string
                    minLength: 3
                    maxLength: 16
                    pattern: ^[a-zA-Z0-9._]*$
                    example: Maria
              required:
                - groupName
                - memberUsernames
      responses:
        "200":
          description: Group successfully created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/group"
        "400":
          $ref: "#/components/responses/BadRequestError" 
        "401":
          $ref: "#/components/responses/UnauthorizedError"
  /groups/{groupId}:
    get:
      parameters:
        - name: groupId
          in: path
          required: true
          description: this is the group id.
          schema:
            description: this is the group id.
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "abcdef012345"
      tags: ["groups"]
      summary: Get group details
      description: Retrieves the current name, photo, and member list for a specific group.
      operationId: getGroupDetails
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Group details retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/group"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Group not found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
  /groups/{groupId}/participants:
    post:
      parameters:
        - name: groupId
          in: path
          required: true
          description: this is the group id.
          schema:
            description: this is the group id.
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "abcdef012345"
      tags: ["groups", "conversations"]
      summary: Add a new member to a group.
      description: |
        An existing group member can add another existing user to
        the specified group
      operationId: addToGroup
      security:
        - BearerAuth: []
      requestBody:
        description: The username of the user to add to the group.
        content:
          application/json:
            schema:
              description: The username of the user to add to the group.
              type: object
              properties:
                username:
                  description: The username of the user to add to the group.
                  type: string
                  example: 'Maria'
                  pattern: ^[a-zA-Z0-9._]+$
                  minLength: 3
                  maxLength: 16
        required: true
      responses:
        "204":
          description: User added to the group successfully.
        "400":
          $ref: "#/components/responses/BadRequestError" 
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: |
            Forbidden (Authenticated user is not a member
            of the group).
        "404":
          description: Group or Username Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
        "409":
          description: |
            Conflict (the target user is already a member).
  /groups/{groupId}/name:
    put:
      parameters:
        - name: groupId
          in: path
          required: true
          description: this is the group id.
          schema:
            description: this is the group id.
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "abcdef012345"
      tags: ["groups", "conversations"]
      summary: Change group name
      description: |
        The authenticated user can update the group name,
        if the new username is not already in use and
        if the user is a current member of the group.
      operationId: setGroupName
      security:
        - BearerAuth: []
      requestBody:
        description: New group name
        required: true
        content:
          application/json:
            schema:
              description: New group name
              type: object
              properties:
                name:
                  description: New group name
                  type: string
                  example: 'Gruppo Classe'
                  pattern: ^.*$
                  minLength: 3
                  maxLength: 25
      responses:
        "204":
          description: Group name changed successfully.
        "400":
          $ref: "#/components/responses/BadRequestError" 
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: |
            Forbidden (Authenticated user is not a member
            of the group).
        "404":
          description: Group Not Found.
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'
        "409":
          description: Conflict (the new group name is already in use).
  /groups/{groupId}/photo:
    put:
      parameters:
        - name: groupId
          in: path
          required: true
          description: this is the group id.
          schema:
            description: this is the group id.
            type: string
            minLength: 8
            maxLength: 32
            pattern: '^[a-zA-Z0-9]+$'
            example: "abcdef012345"
      tags: ["groups", "conversations"]
      summary: Change a group profile picture.
      description: |
        The authenticated user can update the group profile picture
        of an existing group they're a member of.
      operationId: setGroupPhoto
      security:
        - BearerAuth: []
      requestBody:
        description: New group picture
        required: true
        content:
          multipart/form-data:
            schema:
              description: New group picture
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                  minLength: 1 
                  maxLength: 5242880 
                  pattern: '^.*$' 
                  description: |
                    The image file (e.g., JPEG or PNG) to upload as
                    a new group profile picture
      responses:
        "204":
          description: Profile picture updated successfully.
        "400":
          $ref: "#/components/responses/BadRequestError" 
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          description: |
            Forbidden (Authenticated user is not a member
            of the group).
        "404":
          description: Group Not Found
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/NotFoundErrorSchema'

components:
  schemas:
    User:
      type: object
      description: details about a single WASAText user.
      properties:
        username:
          type: string
          pattern: ^[a-zA-Z0-9._]+$
          minLength: 3
          maxLength: 16
          example: 'Marco'
          description: The username of the WASAText user.
        photoURL:
          type: string
          format: url
          example: "https://wasatext.app/storage/photos/abc.jpg" 
          minLength: 10 
          maxLength: 2048 
          pattern: '^https?://.+$' 
          description: The profile picture of the WASAText user.
    conversation:
      type: object
      description: |
        A single conversation, either one-on-one or a group chat.
      properties:
        conversationId:
          type: string
          example: "abcdef012345"
          minLength: 8
          maxLength: 32
          pattern: '^[a-zA-Z0-9]+$'
          description: the unique identifier of the conversation.
        conversationName:
          type: string
          pattern: ^.*$
          minLength: 3
          maxLength: 25
          example: 'Class Group'
          description: |
            the username of the other user (one-on-one) or the
            group name (group chats).
        conversationPhoto:
          type: string
          format: url
          example: "https://wasatext.app/storage/photos/abc.jpg" 
          minLength: 10 
          maxLength: 2048 
          pattern: '^https?://.+$' 
          description: |
            URL of the user's profile picture or the group photo.
        lastMessageTimestamp:
          type: string
          format: date-time
          example: "2025-12-26T17:00:00Z"
          minLength: 20
          maxLength: 29
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
          description: |
            The date and time of the latest message in the conversation.
        lastMessagePreview:
          type: string
          minLength: 1
          maxLength: 30
          pattern: ^.*\S.*$
          description: |
            The preview of the latest message. If the message was a
            picture, this can be represented by an indicator
            (e.g., [Image]).
    group:
      type: object
      description: details about a group (id, name, photo, and members).
      properties:
        groupId:
          type: string
          minLength: 8
          maxLength: 32
          pattern: '^[a-zA-Z0-9]+$'
          description: the unique identifier of the group.
          example: "abcdef012345"
        groupName:
          type: string
          minLength: 3
          maxLength: 25
          pattern: ^.*$
          description: the name of the group.
          example: "Class Group"
        groupPhoto:
          type: string
          format: url
          minLength: 10
          maxLength: 2048
          pattern: '^https?://.+$'
          description: URL of the group profile picture.
          example: "https://wasatext.app/storage/photos/abc.jpg"
        members:
          type: array
          minItems: 1
          maxItems: 50
          description: List of current member usernames.
          items:
            type: string
            description: username of group member
            minLength: 3
            maxLength: 16
            pattern: ^[a-zA-Z0-9._]+$
            example: 'Luca'
    message:
      type: object
      description: a single message (either text or a picture).
      properties:
        messageId:
          type: string
          example: "abcdef012345"
          description: the unique identifier of the message.
          minLength: 8
          maxLength: 32
          pattern: '^[a-zA-Z0-9]+$'
        senderName:
          type: string
          pattern: ^[a-zA-Z0-9._]+$
          minLength: 3
          maxLength: 16
          example: 'Maria'
          description: The username of the sender of the message.
        messageTimestamp:
          type: string
          format: date-time
          example: "2025-12-26T17:00:00Z"
          minLength: 20
          maxLength: 29
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
          description: Date and time the message was sent.
        textContent:
          type: string
          description: The content if the message is a text message.
          minLength: 1
          maxLength: 1000
          pattern: '^\s*[\s\S]*$'
        photoURL:
          type: string
          format: url
          example: "https://wasatext.app/storage/photos/abc.jpg" 
          minLength: 10 
          maxLength: 2048 
          pattern: '^https?://.+$' 
          description: the URL of the photo if the message is a photo message.
        status:
          type: string
          enum:
          - sent
          - received
          - read
          description: |
            checkmarks status (one checkmark if received,
            two checkmarks if read by all participants)
        reactions:
          type: array
          minItems: 0
          maxItems: 50
          description: |
            List of reactions (emoticons) and the names of users who reacted
          items:
            type: object
            properties:
              emoticon:
                description: emoticon of the reaction
                type: string
                minLength: 1
                maxLength: 16
                pattern: '^\P{L}\s*$'
              username:
                description: sender of reaction
                type: string
                minLength: 3
                maxLength: 16
                pattern: ^[a-zA-Z0-9._]*$
        isStarred:
          type: boolean
          description: |
            True if the user has marked has marked
            this message as starred. False otherwise.
      required:
      - messageId
      - senderName
      - messageTimestamp
      - status
      - isStarred
    NotFoundErrorSchema:
      description: Resource Not Found schema
      type: object
      properties:
        message:
          description: message for Resource Not Found schema
          type: string
          minLength: 1
          maxLength: 250
          pattern: '^.*$'
          example: "The specified resource was not found."
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: User Identifier
  responses:
    UnauthorizedError:
      description: Unauthorized Error (Missing or invalid identifier in Authorization header).
      content:
        application/json:
          schema:
            description: Unauthorized Error schema.
            type: object
            properties:
              message:
                description: message for Unauthorized Error
                type: string
                minLength: 1
                maxLength: 150 
                pattern: '^.*$'
                example: "Authentication token is missing or invalid."
    BadRequestError:
      description: Request body or query failed validation checks.
      content:
        application/json:
          schema:
            description: Bad Request Error schema
            type: object
            properties:
              message:
                description: Bad Request Error message
                type: string
                minLength: 1
                maxLength: 150 
                pattern: '^.*$'
                example: "Validation failed: Check input constraints."
